server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/guardian_ai_db
    username: postgres
    password: "0000"  
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate        
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true