server:
  port: 8080

spring:
  datasource:
    # Instance PostgreSQL locale (port 5432). Le conteneur Docker a ete abandonne :
    # il faisait doublon avec l'installation native et consommait plusieurs dizaines
    # de Go pour aucun apport fonctionnel.
    # Surchargeable par variables d'environnement sans toucher au code, ce qui permet
    # de pointer vers une base distante en recette ou en production.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/guardianai}
    username: ${DB_USER:guardianai_user}
    password: ${DB_PASSWORD:motdepasse_fort}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Le schema est cree et versionne par Flyway, pas par Hibernate.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      # Limite alignee sur l'exigence UC-01 du cahier des charges.
      max-file-size: 200MB
      max-request-size: 210MB

guardianai:
  jwt:
    # Cle de signature des jetons. Au moins 32 caracteres : HMAC-SHA256 exige
    # 256 bits, et l'application refuse de demarrer en deca.
    # Valeur de developpement uniquement — a fournir par variable d'environnement
    # en production, ou quiconque lit le depot pourrait forger des jetons valides.
    secret: ${JWT_SECRET:cle-de-developpement-guardianai-a-remplacer-en-production}
    # Duree de validite. Huit heures couvrent une journee de travail sans
    # reconnexion, tout en limitant la fenetre d'exploitation d'un jeton vole.
    validite-heures: ${JWT_VALIDITE_HEURES:8}

  ia-engine:
    # Microservice d'analyse. 127.0.0.1 et non localhost : sous Windows,
    # localhost est resolu d'abord en IPv6 alors qu'uvicorn ecoute en IPv4,
    # ce qui ajoute environ 2 secondes de latence par appel.
    base-url: ${IA_ENGINE_URL:http://127.0.0.1:8000}
    # Delai maximal avant bascule en mode degrade (exigence RNF-01 : < 3 s).
    timeout-seconds: 10

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}