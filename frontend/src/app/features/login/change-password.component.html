<div class="min-h-screen flex items-center justify-center bg-[#070B12] px-6">
  <div class="w-full max-w-[400px]">

    <div class="flex items-center gap-2.5 justify-center mb-2">
      <gd-icon name="shield"></gd-icon>
      <span class="font-mono text-lg font-semibold text-[#E2EBF5]">GuardianAI</span>
    </div>
    <p class="font-sans text-[12px] text-[#5A7A9A] text-center mb-8">
      Renouvellement du mot de passe
    </p>

    <form
      (ngSubmit)="valider()"
      class="bg-[#0C1220] border border-white/[0.07] rounded p-6 flex flex-col gap-4"
    >
      <div class="bg-[#FFB800]/[0.08] border border-[#FFB800]/30 rounded px-3.5 py-3 font-sans text-[12px] text-[#FFB800] leading-relaxed">
        Votre mot de passe actuel vous a été communiqué à la création du compte.
        Il doit être remplacé avant d'accéder à la plateforme.
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="ancien" class="font-mono text-[10px] tracking-[0.08em] uppercase text-[#5A7A9A]">
          Mot de passe actuel
        </label>
        <input
          id="ancien" name="ancien" type="password" autocomplete="current-password"
          [(ngModel)]="ancien" [disabled]="enCours"
          class="bg-[#070B12] border border-white/[0.1] rounded px-3.5 py-2.5 font-mono text-[13px] text-[#E2EBF5] outline-none focus:border-[#00FF88]/50 transition-colors"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="nouveau" class="font-mono text-[10px] tracking-[0.08em] uppercase text-[#5A7A9A]">
          Nouveau mot de passe
        </label>
        <input
          id="nouveau" name="nouveau" type="password" autocomplete="new-password"
          [(ngModel)]="nouveau" [disabled]="enCours"
          class="bg-[#070B12] border border-white/[0.1] rounded px-3.5 py-2.5 font-mono text-[13px] text-[#E2EBF5] outline-none focus:border-[#00FF88]/50 transition-colors"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="confirmation" class="font-mono text-[10px] tracking-[0.08em] uppercase text-[#5A7A9A]">
          Confirmation
        </label>
        <input
          id="confirmation" name="confirmation" type="password" autocomplete="new-password"
          [(ngModel)]="confirmation" [disabled]="enCours"
          class="bg-[#070B12] border border-white/[0.1] rounded px-3.5 py-2.5 font-mono text-[13px] text-[#E2EBF5] outline-none focus:border-[#00FF88]/50 transition-colors"
        />
      </div>

      <!-- Contrôles affichés au fil de la saisie, sans attendre l'envoi -->
      <div *ngIf="problemesLocaux.length" class="flex flex-col gap-1">
        <div
          *ngFor="let p of problemesLocaux"
          class="font-sans text-[11px] text-[#FFB800]"
        >
          {{ p }}
        </div>
      </div>

      <div
        *ngIf="erreur"
        class="bg-[#FF4444]/[0.08] border border-[#FF4444]/30 rounded px-3.5 py-2.5 font-sans text-[12px] text-[#FF4444]"
      >
        {{ erreur }}
        <div *ngFor="let r of regles" class="mt-1">· {{ r }}</div>
      </div>

      <button
        type="submit"
        [disabled]="enCours || !pretAValider"
        class="mt-1 font-mono text-[11px] tracking-[0.1em] text-[#00FF88] bg-[#00FF88]/10 border border-[#00FF88]/[0.35] px-6 py-3 rounded-sm cursor-pointer hover:bg-[#00FF88]/[0.16] transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
      >
        {{ enCours ? 'ENREGISTREMENT…' : 'CHANGER LE MOT DE PASSE' }}
      </button>
    </form>

    <!--
      Sortie de secours : sans elle, quelqu'un qui ne connaît pas son mot de
      passe actuel resterait bloqué sur cet écran, la navigation étant coupée.
    -->
    <div class="mt-5 text-center">
      <button
        (click)="auth.deconnexion()"
        class="font-mono text-[10px] tracking-[0.08em] text-[#5A7A9A] bg-transparent border-0 underline cursor-pointer hover:text-[#E2EBF5] transition-colors"
      >
        SE DÉCONNECTER
      </button>
    </div>
  </div>
</div>
