<div class="flex flex-col gap-6">
  <div>
    <h2 class="font-mono text-lg font-semibold text-[#E2EBF5] m-0 mb-1">System Status</h2>
    <p class="font-sans text-[13px] text-[#5A7A9A] m-0">Health and latency of GuardianAI backend services</p>
  </div>

  <div
    *ngIf="error"
    class="bg-[#FF4444]/[0.08] border border-[#FF4444]/30 rounded px-5 py-3.5 font-mono text-[12px] text-[#FF4444]"
  >
    {{ error }}
  </div>

  <div class="bg-[#0C1220] border border-white/[0.07] rounded overflow-hidden">
    <div class="px-5 py-3.5 border-b border-white/[0.07] font-mono text-[11px] tracking-[0.1em] uppercase text-[#5A7A9A]">
      Services
    </div>
    <div *ngFor="let s of services" class="px-5 py-4 flex items-center justify-between border-b border-white/[0.04]">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full" [style.background]="statusColor(s.status)"></span>
        <span class="font-sans text-[13px] text-[#E2EBF5]">{{ s.name }}</span>
      </div>
      <div class="flex items-center gap-8">
        <div class="text-right">
          <div class="font-mono text-[10px] text-[#5A7A9A]">Latency</div>
          <div class="font-mono text-xs text-[#E2EBF5]">{{ s.latency }}</div>
        </div>
        <div class="text-right">
          <div class="font-mono text-[10px] text-[#5A7A9A]">Uptime (30d)</div>
          <div class="font-mono text-xs text-[#E2EBF5]">{{ s.uptime }}</div>
        </div>
        <span
          class="font-mono text-[10px] tracking-[0.08em] uppercase px-2.5 py-1 rounded-sm border"
          [style.color]="statusColor(s.status)"
          [style.borderColor]="statusColor(s.status) + '4D'"
          [style.background]="statusColor(s.status) + '14'"
        >
          {{ s.status }}
        </span>
      </div>
    </div>
  </div>
</div>
